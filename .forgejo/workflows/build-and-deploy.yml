name: Build and deploy site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: auriga
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          FORGE_BASE_URL: ${{ github.server_url }}/migalmoreno/
          HOME: /tmp/runner-home
          npm_config_cache: ${{ github.workspace }}/.npm-cache
          TMPDIR: /tmp/ci
        run: |
          mkdir -p /tmp/runner-home /tmp/ci
          rm -rf /tmp/npm-work
          mkdir -p /tmp/npm-work
          cp package.json /tmp/npm-work/
          npm install --prefix /tmp/npm-work --omit=optional --ignore-scripts
          ln -sfn /tmp/npm-work/node_modules ./node_modules
          nix develop --command bash -c "clojure -M:build"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: /tmp/npm-work/node_modules/.bin/wrangler pages deploy ./site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
