name: Build and deploy site

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight

jobs:
  build-and-deploy:
    runs-on: cygnus
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy
        env:
          FORGE_BASE_URL: ${{ github.server_url }}/migalmoreno/
          HOME: /tmp/runner-home
          npm_config_cache: ${{ github.workspace }}/.npm-cache
          TMPDIR: /tmp/ci
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p /tmp/runner-home /tmp/ci
          rm -rf /tmp/npm-work
          mkdir -p /tmp/npm-work
          cp package.json /tmp/npm-work/
          npm install --prefix /tmp/npm-work --omit=dev
          ln -sfn /tmp/npm-work/node_modules ./node_modules
          nix develop --command bash -c "clojure -M:build && wrangler pages deploy ./site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main"
